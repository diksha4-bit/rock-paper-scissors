<!DOCTYPE html>
<html>
  <head>

    <title>Rock Paper Scissors</title>
    <style>
        body{
            background-color: rgb(0,0,0);
            color: white;
            font-family: Arial;
        }
        .title{
            font-size: 30px;
            font-weight: bold;
        }
        .move-icon{
            width: 50px;
            height: 50px;
        }
        .move-button{
            background-color: transparent;
            border: 3px solid white;
            padding: 20px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-right: 10px;
            cursor: pointer;
        }
        .result{
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
        }
        .score{
            margin-top: 60px;
        }
        .reset-score-button{
            padding: 5px 10px;
            background-color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

    </style>
  </head>
  <body>
  <p class="title">Rock Paper Scissors</p>
  <button onclick="
  const computerMove = pickComputerMove();

   let result = '';

if (computerMove === 'rock') {
  result = 'Tie.';
} else if (computerMove === 'paper') {
  result = 'You Lose.';
} else {
  result = 'You Win.';
}

if (result === 'You Win.') {
  score.wins++;
} else if (result === 'You Lose.') {
  score.losses++;
} else {
  score.ties++;
}

updateScore();

document.querySelector('.js-result').innerHTML = result;
document.querySelector('.js-moves').innerHTML = 
`You picked rock. Computer picked ${computerMove}.`;

  " class="move-button">
  <img src="../Images/paper-emoji.png" class="move-icon"></button>

  <button onclick="
   const computerMove = pickComputerMove();

   let result = '';
  if (computerMove === 'rock') {
    result = 'You Lose.';
  } else if (computerMove === 'paper') {
    result = 'You Win.';
  } else {
    result = 'Tie.';
  }

  score.losses++;
} else {

}

document.querySelector('.js-result').innerHTML = result;

  " class="move-button">
  <img src="../Images/scissors-emoji.png" class="move-icon"></button>

  <p class="js-result result"></p>
  <p class="js-moves">
    
  </p>

  <p id="score" class="score">
  Wins: 0, Losses: 0, Ties: 0
</p>

  <button onclick="
   score.wins = 0;
   score.losses = 0;
   score.ties = 0;  
  localStorage.removeItem('score');
  updateScore()" class="reset-score-button">Reset Score</button>
    </body>

    <script>
     let score = {
      wins: 0,
      losses: 0,
      ties: 0
    };

  function updateScore() {
     document.getElementById('score').innerHTML = 
     `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
  }

  function pickComputerMove() {
  const randomNumber = Math.random();
  
  let computerMove = '';
  if (randomNumber >= 0 && randomNumber <= 1/3) {
    computerMove = 'rock';
  } else if (randomNumber >= 1/3 && randomNumber <= 2/3) {
    computerMove = 'paper';
  } else {
    computerMove = 'scissors';
  }
    return computerMove;
      }
    </script>
</html>
